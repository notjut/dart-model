name: SportsDataIO isolated trial audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/test/sportsdataio-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare checked audit source
        run: |
          python - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          allowed = {'scripts/audit_sportsdataio.py', 'tests/test_sportsdataio_audit.py'}
          payload = json.loads(Path('darkhorse-release.json').read_text())
          written = set()
          for item in payload['files']:
              if item['path'] not in allowed:
                  continue
              content = item['content']
              if hashlib.sha256(content.encode()).hexdigest() != item['sha256']:
                  raise ValueError('Audit source checksum mismatch')
              path = Path(item['path'])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)
              written.add(item['path'])
          if written != allowed:
              raise ValueError('Missing audit source')
          PYCODE
      - name: Check credential handling and trial isolation
        run: python -m unittest discover -s tests -p 'test_sportsdataio_audit.py'
      - name: Test SportsDataIO injury coverage without changing predictions
        env:
          SPORTSDATAIOAPIKEY: ${{ secrets.SPORTSDATAIOAPIKEY }}
        run: python scripts/audit_sportsdataio.py
